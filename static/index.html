<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MedDRA Coding Assistant</title>
<style>
  :root {
    --bg: #0e1117; --panel: #161b22; --panel2: #1c2230; --border: #2b3240;
    --text: #e6edf3; --muted: #8b949e; --accent: #3b82f6; --accent2: #22c55e;
    --chip: #21324d; --danger: #ef4444;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f8fa; --panel: #ffffff; --panel2: #f0f3f7; --border: #d0d7de;
      --text: #1f2328; --muted: #656d76; --accent: #2563eb; --accent2: #16a34a;
      --chip: #e6efff; --danger: #dc2626;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.5;
  }
  .header-wrap { max-width: 1400px; margin: 0 auto; padding: 20px 16px; text-align: center; }
  .signature { margin: 6px 0 16px; }
  .name-wrap {
    position: relative; display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 22px;
  }
  .name-wrap .atom {
    position: absolute; left: 50%; top: 50%; font-size: 1.3rem; color: var(--accent);
    opacity: .55; pointer-events: none;
    animation: orbit 5s linear infinite;
    transform-origin: -46px center;
  }
  @keyframes orbit {
    from { transform: rotate(0deg) translateX(46px) rotate(0deg); }
    to   { transform: rotate(360deg) translateX(46px) rotate(-360deg); }
  }
  .signature .name {
    position: relative; display: inline-block; font-size: 1.4rem; font-weight: 800;
    letter-spacing: .01em; font-family: "Segoe UI", "Georgia", serif;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent;
    animation: glow-pulse 3.2s ease-in-out infinite;
  }
  @keyframes glow-pulse {
    0%, 100% { filter: drop-shadow(0 0 2px rgba(59,130,246,.35)); }
    50%      { filter: drop-shadow(0 0 9px rgba(34,197,94,.55)); }
  }
  .spark {
    position: absolute; font-size: .62rem; color: var(--accent2); opacity: 0;
    animation: twinkle 2.4s ease-in-out infinite;
  }
  .spark1 { top: -8px;  left: -6px;  animation-delay: 0s;   color: var(--accent); }
  .spark2 { top: -2px;  right: -10px; animation-delay: .8s; }
  .spark3 { bottom: -8px; left: 30%; animation-delay: 1.5s; color: var(--accent); }
  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(.3) rotate(0deg); }
    50%      { opacity: 1; transform: scale(1) rotate(180deg); }
  }
  .signature .rule {
    width: 90px; height: 3px; margin: 7px auto 0; border-radius: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
  }
  .signature .role { color: var(--muted); font-size: .74rem; letter-spacing: .18em; text-transform: uppercase; margin-top: 6px; }
  header { margin: 10px 0 8px; }
  header h1 { margin: 0; font-size: 1.7rem; letter-spacing: -.02em; }
  header p { color: var(--muted); margin: 6px 0 0; font-size: .95rem; }

  .searchbar { display: flex; gap: 8px; margin: 22px 0 12px; }
  .searchbar input {
    flex: 1; padding: 14px 16px; font-size: 1.05rem; border-radius: 12px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text); outline: none;
  }
  .searchbar input:focus { border-color: var(--accent); }
  .searchbar button {
    padding: 0 20px; font-size: 1rem; font-weight: 600; border: none; border-radius: 12px;
    background: var(--accent); color: #fff; cursor: pointer;
  }
  .searchbar button:disabled { opacity: .6; cursor: default; }

  .examples { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 20px; justify-content: center; }
  .examples span { color: var(--muted); font-size: .85rem; align-self: center; }
  .chip {
    background: var(--chip); color: var(--text); border: 1px solid var(--border);
    padding: 5px 11px; border-radius: 999px; font-size: .85rem; cursor: pointer;
  }
  .chip:hover { border-color: var(--accent); }

  /* Split screen layout */
  .results-container {
    max-width: 1400px; margin: 0 auto; padding: 0 16px 64px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
  }
  @media (max-width: 1024px) {
    .results-container { grid-template-columns: 1fr; }
  }

  .results-side {
    border: 1px solid var(--border); border-radius: 12px; padding: 16px;
    background: var(--panel2); min-height: 400px;
  }
  .results-side-title {
    font-size: .9rem; font-weight: 700; color: var(--muted); margin: 0 0 12px;
    text-transform: uppercase; letter-spacing: .06em;
  }
  .results-side-title.ai { color: var(--accent); }

  .status { color: var(--muted); font-size: .9rem; margin: 10px 0; min-height: 1.2em; }

  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 10px; display: flex; gap: 12px; align-items: flex-start;
  }
  .rank { font-size: .75rem; color: var(--muted); min-width: 20px; padding-top: 2px; }
  .card .body { flex: 1; min-width: 0; }
  .llt { font-weight: 700; font-size: 1.05rem; color: var(--accent); line-height: 1.3; }
  .llt .lbl {
    font-size: .6rem; font-weight: 700; color: #fff; background: var(--accent);
    padding: 1px 5px; border-radius: 4px; margin-right: 6px; vertical-align: middle; letter-spacing: .02em;
  }
  .ptline { font-size: .85rem; margin-top: 4px; color: var(--muted); }
  .ptline b { color: var(--text); font-weight: 600; }
  .meta { color: var(--muted); font-size: .75rem; margin-top: 3px; }
  .meta code { background: var(--panel2); padding: 1px 5px; border-radius: 4px; font-family: monospace; }
  .tags { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 5px; }
  .tag { font-size: .65rem; padding: 2px 7px; border-radius: 5px; background: var(--panel2); color: var(--muted); }
  .tag.soc { background: var(--chip); color: var(--text); }
  .tag.aipick { background: var(--accent); color: #fff; }
  .tag.ime { background: var(--danger); color: #fff; font-weight: 600; }
  .conf { text-align: right; min-width: 70px; }
  .conf .num { font-weight: 700; font-size: .95rem; color: var(--accent2); }
  .bar { height: 5px; border-radius: 3px; background: var(--panel2); margin-top: 4px; overflow: hidden; }
  .bar > div { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
  .sub { font-size: .65rem; color: var(--muted); margin-top: 3px; }

  .copy-buttons { display: flex; gap: 6px; margin-top: 6px; }
  .copy {
    flex: 1; font-size: .7rem; padding: 3px 7px; border-radius: 6px; cursor: pointer;
    background: var(--panel2); color: var(--text); border: 1px solid var(--border); white-space: nowrap;
  }
  .copy:hover { border-color: var(--accent); }
  .copy.done { border-color: var(--accent2); color: var(--accent2); }

  .aibanner {
    background: var(--chip); border: 1px solid var(--border); border-left: 3px solid var(--accent);
    border-radius: 8px; padding: 8px 10px; margin-bottom: 10px; font-size: .8rem;
  }
  .aibanner b { color: var(--accent); }

  footer { text-align: center; color: var(--muted); font-size: .8rem; margin-top: 28px; }
  footer a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<div class="header-wrap">
  <div class="signature">
    <div class="name-wrap">
      <span class="atom" aria-hidden="true">⚛</span>
      <span class="name">Abishek</span>
      <span class="spark spark1" aria-hidden="true">✦</span>
      <span class="spark spark2" aria-hidden="true">✧</span>
      <span class="spark spark3" aria-hidden="true">✦</span>
    </div>
    <div class="rule"></div>
    <div class="role">Pharmacovigilance</div>
  </div>
  <header>
    <h1>🩺 MedDRA Coding Assistant</h1>
    <p>Hybrid search (instant) vs AI re-ranking (parallel) — side by side.</p>
  </header>

  <div class="searchbar">
    <input id="q" type="text" placeholder="e.g. bleeding, tablet is hard, SOB, drug not working…" autocomplete="off" autofocus />
    <button id="go">Search</button>
  </div>

  <div class="examples">
    <span>Try:</span>
    <span class="chip">bleeding</span>
    <span class="chip">tablet is hard</span>
    <span class="chip">SOB</span>
    <span class="chip">hedache</span>
  </div>
</div>

<div class="results-container">
  <!-- LEFT: Hybrid Search Results -->
  <div class="results-side">
    <div class="results-side-title">🔍 Hybrid Search (Instant)</div>
    <div class="status" id="statusHybrid"></div>
    <div id="resultsHybrid"></div>
  </div>

  <!-- RIGHT: AI Results -->
  <div class="results-side">
    <div class="results-side-title ai">🤖 AI Re-Ranked (Live)</div>
    <div class="status" id="statusAI"></div>
    <div id="resultsAI"></div>
  </div>
</div>

<footer>Hybrid fuzzy + semantic search with optional AI accuracy layer · <a href="/docs">API docs</a></footer>

<script>
  const qEl = document.getElementById('q');
  const goEl = document.getElementById('go');

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  const FETCH_K = 30;

  async function search(text) {
    text = (text || '').trim();
    if (!text) return;
    goEl.disabled = true;

    // Fetch both results in parallel
    const [hybridRes, aiRes] = await Promise.all([
      fetch('/api/code?q=' + encodeURIComponent(text) + '&top_k=' + FETCH_K + '&ai=false'),
      fetch('/api/code?q=' + encodeURIComponent(text) + '&top_k=' + FETCH_K + '&ai=true')
    ]);

    if (!hybridRes.ok || !aiRes.ok) {
      document.getElementById('statusHybrid').textContent = 'Error loading results';
      goEl.disabled = false;
      return;
    }

    const hybridData = await hybridRes.json();
    const aiData = await aiRes.json();

    drawHybrid(hybridData);
    drawAI(aiData);
    goEl.disabled = false;
  }

  function cardHTML(r, i, showAIPick = false) {
    return `
      <div class="card">
        <div class="rank">#${i + 1}</div>
        <div class="body">
          <div class="llt"><span class="lbl">${esc(r.level)}</span>${esc(r.term)}</div>
          ${(r.pt && r.pt.toLowerCase() !== r.term.toLowerCase())
            ? `<div class="ptline">↳ PT: <b>${esc(r.pt)}</b></div>` : ''}
          <div class="meta">ID <code>${esc(r.term_id)}</code></div>
          <div class="tags">
            ${r.soc ? `<span class="tag soc">${esc(r.soc.substring(0, 12))}</span>` : ''}
            ${r.is_ime ? '<span class="tag ime">⚠️ IME</span>' : ''}
            ${showAIPick && r.ai_pick ? '<span class="tag aipick">🤖 Pick</span>' : ''}
          </div>
          <div class="sub">${r.semantic_score}% sem · ${r.lexical_score}% lex</div>
          <div class="copy-buttons">
            <button class="copy" data-copy="${esc(r.term)}">📋 Copy LLT</button>
            ${r.pt && r.pt !== r.term ? `<button class="copy" data-copy="${esc(r.pt)}">📋 Copy PT</button>` : ''}
          </div>
        </div>
        <div class="conf"><div class="num">${r.confidence}%</div><div class="bar"><div style="width:${Math.max(4, Math.min(100, r.confidence))}%"></div></div></div>
      </div>`;
  }

  function drawHybrid(data) {
    const statusEl = document.getElementById('statusHybrid');
    const resultsEl = document.getElementById('resultsHybrid');
    if (!data.results || data.results.length === 0) {
      statusEl.textContent = 'No matches for "' + esc(data.query) + '"';
      resultsEl.innerHTML = '';
      return;
    }
    statusEl.textContent = data.count + ' matches';
    resultsEl.innerHTML = data.results.map((r, i) => cardHTML(r, i, false)).join('');
    attachCopyListeners(resultsEl);
  }

  function drawAI(data) {
    const statusEl = document.getElementById('statusAI');
    const resultsEl = document.getElementById('resultsAI');

    let banner = '';
    if (data.ai && data.ai.used && data.ai.interpretation) {
      banner = `<div class="aibanner">📝 <b>${esc(data.ai.interpretation)}</b></div>`;
    }

    if (!data.results || data.results.length === 0) {
      statusEl.innerHTML = banner + 'No matches found';
      resultsEl.innerHTML = '';
      return;
    }
    statusEl.innerHTML = banner + (data.count || 0) + ' matches';
    resultsEl.innerHTML = data.results.map((r, i) => cardHTML(r, i, true)).join('');
    attachCopyListeners(resultsEl);
  }

  function attachCopyListeners(container) {
    container.querySelectorAll('.copy').forEach(btn => btn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(btn.dataset.copy);
        const t = btn.textContent; btn.textContent = '✅'; btn.classList.add('done');
        setTimeout(() => { btn.textContent = t; btn.classList.remove('done'); }, 800);
      } catch (e) { }
    }));
  }

  goEl.addEventListener('click', () => search(qEl.value));
  qEl.addEventListener('keydown', e => { if (e.key === 'Enter') search(qEl.value); });
  document.querySelectorAll('.chip').forEach(c =>
    c.addEventListener('click', () => search(c.textContent)));
</script>
</body>
</html>
