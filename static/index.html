<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MedDRA Coding Assistant</title>
<style>
  :root {
    --bg: #0e1117; --panel: #161b22; --panel2: #1c2230; --border: #2b3240;
    --text: #e6edf3; --muted: #8b949e; --accent: #3b82f6; --accent2: #22c55e; --danger: #ef4444;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f8fa; --panel: #ffffff; --panel2: #f0f3f7; --border: #d0d7de;
      --text: #1f2328; --muted: #656d76; --accent: #2563eb; --accent2: #16a34a; --danger: #dc2626;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 24px 16px 64px; }
  
  .signature { text-align: center; margin: 8px 0 14px; }
  .name-wrap { position: relative; display: inline-flex; align-items: center; gap: 6px; padding: 4px 20px; }
  .name-wrap .atom { position: absolute; left: 50%; top: 50%; font-size: 1.2rem; color: var(--accent); opacity: .55; pointer-events: none; animation: orbit 5s linear infinite; transform-origin: -44px center; }
  @keyframes orbit { from { transform: rotate(0deg) translateX(44px) rotate(0deg); } to { transform: rotate(360deg) translateX(44px) rotate(-360deg); } }
  .signature .name { position: relative; font-size: 1.3rem; font-weight: 800; background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: glow-pulse 3.2s ease-in-out infinite; }
  @keyframes glow-pulse { 0%, 100% { filter: drop-shadow(0 0 2px rgba(59,130,246,.35)); } 50% { filter: drop-shadow(0 0 9px rgba(34,197,94,.55)); } }
  .signature .rule { width: 80px; height: 2px; margin: 6px auto 0; border-radius: 2px; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
  .signature .role { color: var(--muted); font-size: .7rem; letter-spacing: .15em; text-transform: uppercase; margin-top: 4px; }

  header { text-align: center; margin: 8px 0 6px; }
  header h1 { margin: 0; font-size: 1.6rem; letter-spacing: -.01em; }
  header p { color: var(--muted); margin: 4px 0 0; font-size: .9rem; }

  .searchbar { display: flex; gap: 8px; margin: 20px 0 10px; }
  .searchbar input { flex: 1; padding: 12px 14px; font-size: 1rem; border-radius: 10px; border: 1px solid var(--border); background: var(--panel); color: var(--text); outline: none; }
  .searchbar input:focus { border-color: var(--accent); }
  .searchbar button { padding: 0 18px; font-size: .95rem; font-weight: 600; border: none; border-radius: 10px; background: var(--accent); color: #fff; cursor: pointer; }
  .searchbar button:disabled { opacity: .6; cursor: default; }

  .examples { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 14px; justify-content: center; }
  .examples span { color: var(--muted); font-size: .8rem; align-self: center; }
  .chip { background: var(--panel2); color: var(--text); border: 1px solid var(--border); padding: 4px 10px; border-radius: 999px; font-size: .8rem; cursor: pointer; }
  .chip:hover { border-color: var(--accent); }

  .tabs { display: flex; gap: 2px; margin: 20px 0 12px; border-bottom: 1px solid var(--border); align-items: center; }
  .tab-btn { padding: 10px 16px; font-size: .85rem; font-weight: 600; background: none; border: none; border-bottom: 2px solid transparent; color: var(--muted); cursor: pointer; }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-btn:hover { color: var(--text); }

  .ai-indicator {
    margin-left: auto; display: flex; align-items: center; gap: 6px; padding: 6px 12px;
    border-radius: 20px; font-size: .75rem; font-weight: 600;
  }
  .ai-indicator .dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  }
  .ai-indicator.live { background: rgba(34,197,94,.1); color: var(--accent2); border: 1px solid var(--accent2); }
  .ai-indicator.live .dot { background: var(--accent2); box-shadow: 0 0 6px 1px var(--accent2); }
  .ai-indicator.quota { background: rgba(239,68,68,.1); color: var(--danger); border: 1px solid var(--danger); }
  .ai-indicator.quota .dot { background: var(--danger); box-shadow: 0 0 6px 1px var(--danger); }
  .ai-indicator.failed { background: rgba(239,68,68,.1); color: var(--danger); border: 1px solid var(--danger); }
  .ai-indicator.failed .dot { background: var(--danger); }
  .ai-indicator.unchecked { background: rgba(139,148,158,.1); color: var(--muted); border: 1px solid var(--muted); }
  .ai-indicator.unchecked .dot { background: var(--muted); }

  .status { color: var(--muted); font-size: .85rem; margin: 12px 0; min-height: 1.2em; }
  
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px; margin-bottom: 8px; display: flex; gap: 10px; align-items: flex-start;
  }
  .rank { font-size: .7rem; color: var(--muted); min-width: 18px; padding-top: 1px; font-weight: 600; }
  .card .body { flex: 1; min-width: 0; }
  .llt { font-weight: 700; font-size: 1rem; color: var(--accent); line-height: 1.2; }
  .llt .lbl { font-size: .55rem; font-weight: 700; color: #fff; background: var(--accent); padding: 1px 4px; border-radius: 3px; margin-right: 5px; vertical-align: middle; }
  .ptline { font-size: .8rem; margin-top: 3px; color: var(--muted); }
  .ptline b { color: var(--text); font-weight: 600; }
  .soc { font-size: .75rem; margin-top: 2px; color: var(--muted); }
  .soc b { color: var(--text); font-weight: 600; }
  .tags { margin-top: 5px; display: flex; flex-wrap: wrap; gap: 4px; }
  .tag { font-size: .6rem; padding: 1px 5px; border-radius: 4px; background: var(--panel2); color: var(--muted); }
  .tag.ime { background: var(--danger); color: #fff; font-weight: 600; }
  .tag.ai-pick { background: var(--accent); color: #fff; }

  .copy-buttons { display: flex; gap: 5px; margin-top: 6px; }
  .copy { flex: 1; font-size: .7rem; padding: 3px 6px; border-radius: 5px; cursor: pointer; background: var(--panel2); color: var(--text); border: 1px solid var(--border); }
  .copy:hover { border-color: var(--accent); }
  .copy.done { border-color: var(--accent2); color: var(--accent2); }

  .conf { text-align: center; min-width: 50px; font-weight: 700; font-size: .9rem; color: var(--accent2); }

  .analyzing {
    text-align: center; padding: 20px; color: var(--muted); font-size: .9rem;
  }
  .spinner {
    display: inline-block; width: 20px; height: 20px; border: 2px solid var(--muted);
    border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite;
    margin-right: 8px; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

  footer { text-align: center; color: var(--muted); font-size: .75rem; margin-top: 20px; }
  footer a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="signature">
    <div class="name-wrap">
      <span class="atom" aria-hidden="true">⚛</span>
      <span class="name">Abishek</span>
    </div>
    <div class="rule"></div>
    <div class="role">Pharmacovigilance</div>
  </div>
  <header>
    <h1>🩺 MedDRA Coding</h1>
    <p>Fast hybrid search: type a symptom, get MedDRA codes instantly.</p>
  </header>

  <div class="searchbar">
    <input id="q" type="text" placeholder="bleeding, tablet is hard, SOB, drug not working…" autocomplete="off" autofocus />
    <button id="go">Search</button>
  </div>

  <div class="examples">
    <span>Try:</span>
    <span class="chip">bleeding</span>
    <span class="chip">tablet is hard</span>
    <span class="chip">SOB</span>
    <span class="chip">hedache</span>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" data-tab="hybrid">🔍 Hybrid Search</button>
    <button class="tab-btn" data-tab="ai">🤖 AI Analysis</button>
    <div class="ai-indicator unchecked" id="aiIndicator" title="Checking AI status…">
      <span class="dot"></span>
      <span id="aiIndicatorText">AI Checking</span>
    </div>
  </div>

  <!-- Tab: Hybrid -->
  <div class="tab-content active" id="tab-hybrid">
    <div class="status" id="statusHybrid"></div>
    <div id="resultsHybrid"></div>
  </div>

  <!-- Tab: AI -->
  <div class="tab-content" id="tab-ai">
    <div class="status" id="statusAI"></div>
    <div id="resultsAI"></div>
  </div>

  <footer><a href="/credits">Credits</a> · <a href="/docs">API docs</a></footer>
</div>

<script>
  const qEl = document.getElementById('q');
  const goEl = document.getElementById('go');
  const statusEl = document.getElementById('status');
  const aiIndicator = document.getElementById('aiIndicator');
  const aiIndicatorText = document.getElementById('aiIndicatorText');

  // Poll AI health status
  async function checkAIHealth() {
    try {
      const res = await fetch('/api/ai-health', { cache: 'no-store' });
      const data = await res.json();
      
      aiIndicator.classList.remove('live', 'quota', 'failed', 'unchecked');
      
      if (!data.configured) {
        aiIndicator.classList.add('failed');
        aiIndicatorText.textContent = 'AI Not Configured';
        aiIndicator.title = 'AI API key not set on server';
      } else if (data.live) {
        aiIndicator.classList.add('live');
        aiIndicatorText.textContent = 'AI Live';
        aiIndicator.title = 'AI API is working';
      } else {
        const detail = (data.detail || '').toLowerCase();
        if (detail.includes('quota') || detail.includes('rate limit')) {
          aiIndicator.classList.add('quota');
          aiIndicatorText.textContent = 'Quota Exceeded';
          aiIndicator.title = 'AI quota exhausted or rate limited';
        } else if (detail.includes('invalid') || detail.includes('dead') || detail.includes('key')) {
          aiIndicator.classList.add('failed');
          aiIndicatorText.textContent = 'Key Invalid';
          aiIndicator.title = 'AI API key is invalid or dead';
        } else {
          aiIndicator.classList.add('failed');
          aiIndicatorText.textContent = 'AI Down';
          aiIndicator.title = 'AI API is unavailable: ' + detail;
        }
      }
    } catch (e) {
      aiIndicator.classList.remove('live', 'quota', 'failed', 'unchecked');
      aiIndicator.classList.add('failed');
      aiIndicatorText.textContent = 'AI Unreachable';
      aiIndicator.title = 'Could not reach server to check AI status';
    }
  }

  // Check AI health on page load and periodically
  checkAIHealth();
  setInterval(checkAIHealth, 30000); // Every 30 seconds

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  // Tab switching
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tab = btn.dataset.tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-' + tab).classList.add('active');
    });
  });

  async function search(text) {
    text = (text || '').trim();
    if (!text) return;
    goEl.disabled = true;

    // Show hybrid tab, loading state
    document.querySelector('[data-tab="hybrid"]').click();
    document.getElementById('statusHybrid').textContent = 'Searching…';
    document.getElementById('resultsHybrid').innerHTML = '';
    document.getElementById('statusAI').textContent = '';
    document.getElementById('resultsAI').innerHTML = '';

    try {
      // Fetch hybrid search (instant)
      const hybridRes = await fetch('/api/code?q=' + encodeURIComponent(text) + '&top_k=20&ai=false');
      if (!hybridRes.ok) throw new Error('HTTP ' + hybridRes.status);
      const hybridData = await hybridRes.json();

      if (!hybridData.results || hybridData.results.length === 0) {
        document.getElementById('statusHybrid').textContent = 'No matches for "' + esc(hybridData.query) + '". Try rephrasing.';
        goEl.disabled = false;
        return;
      }

      // Show hybrid results immediately
      document.getElementById('statusHybrid').textContent = hybridData.count + ' matches for "' + esc(hybridData.query) + '"';
      drawResults(hybridData.results, 'resultsHybrid');
      goEl.disabled = false;

      // Fetch AI in background with analyzing animation
      document.getElementById('statusAI').innerHTML = '<span class="spinner"></span>Analyzing with AI…';
      document.getElementById('resultsAI').innerHTML = '<div class="analyzing"><span class="spinner"></span>Processing results…</div>';

      const aiRes = await fetch('/api/code?q=' + encodeURIComponent(text) + '&top_k=20&ai=true');
      if (aiRes.ok) {
        const aiData = await aiRes.json();
        if (aiData.results && aiData.results.length > 0) {
          document.getElementById('statusAI').textContent = aiData.count + ' AI re-ranked matches';
          drawResults(aiData.results, 'resultsAI', true);
        } else {
          document.getElementById('statusAI').textContent = 'AI analysis: no matches found';
          document.getElementById('resultsAI').innerHTML = '';
        }
      } else {
        document.getElementById('statusAI').textContent = 'AI analysis unavailable';
        document.getElementById('resultsAI').innerHTML = '';
      }
    } catch (e) {
      document.getElementById('statusHybrid').textContent = 'Error: ' + e.message;
    }
  }

  function drawResults(results, containerId, showAIPick = false) {
    const container = document.getElementById(containerId);
    container.innerHTML = results.map((r, i) => `
      <div class="card">
        <div class="rank">#${i + 1}</div>
        <div class="body">
          <div class="llt"><span class="lbl">${esc(r.level)}</span>${esc(r.term)}</div>
          ${r.pt && r.pt.toLowerCase() !== r.term.toLowerCase() ? `<div class="ptline">↳ PT: <b>${esc(r.pt)}</b></div>` : ''}
          ${r.soc ? `<div class="soc">SOC: <b>${esc(r.soc)}</b></div>` : ''}
          <div class="tags">
            ${r.is_ime ? '<span class="tag ime">⚠️ IME</span>' : ''}
            ${showAIPick && r.ai_pick ? '<span class="tag ai-pick">🤖 Pick</span>' : ''}
          </div>
          <div class="copy-buttons">
            <button class="copy" data-copy="${esc(r.term)}">📋 LLT</button>
            ${r.pt && r.pt !== r.term ? `<button class="copy" data-copy="${esc(r.pt)}">📋 PT</button>` : ''}
          </div>
        </div>
        <div class="conf">${r.confidence}%</div>
      </div>
    `).join('');

    container.querySelectorAll('.copy').forEach(btn => btn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(btn.dataset.copy);
        const t = btn.textContent; btn.textContent = '✅'; btn.classList.add('done');
        setTimeout(() => { btn.textContent = t; btn.classList.remove('done'); }, 800);
      } catch (e) { }
    }));
  }

  goEl.addEventListener('click', () => search(qEl.value));
  qEl.addEventListener('keydown', e => { if (e.key === 'Enter') search(qEl.value); });
  document.querySelectorAll('.chip').forEach(c =>
    c.addEventListener('click', () => search(c.textContent)));
</script>
</body>
</html>
